jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 15.4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.0'
        modules: 'qtwebengine qt5compat qtshadertools qtmultimedia qttools qttranslations qtimageformats qtmacextras qttexttospeech'
        cache: 'true'

    - name: Install Toolchain Dependencies
      run: |
        brew update
        brew install cmake ninja

    - name: Configure
      working-directory: ${{runner.workspace}}/TeamTalk5/Build
      run: |
        cmake .. -DCMAKE_CXX_COMPILER=$(which clang++) -DCMAKE_OBJCXX_COMPILER=$(which clang++) -DFEATURE_WEBRTC=OFF -DFEATURE_PORTAUDIO=OFF -DBUILD_TEAMTALK_LIBRARY_UNITTEST_CATCH2=OFF

    - name: Build
      working-directory: ${{runner.workspace}}/TeamTalk5/Build
      run: |
        cmake --build .

    - name: Run CMake Install
      working-directory: ${{runner.workspace}}/TeamTalk5/Build
      run: |
        cmake --install . --prefix "${{runner.workspace}}/install"

    - name: Upload TeamTalk Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: teamtalk-artifacts
        path: "${{runner.workspace}}/install"
